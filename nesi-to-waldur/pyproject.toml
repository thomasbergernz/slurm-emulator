[project]
name = "nesi-to-waldur"
version = "0.1.0"
description = "Repeatable NeSI legacy projects-database -> Waldur marketplace migration pipeline."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.scripts]
nesi-to-waldur = "nesi_to_waldur.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nesi_to_waldur"]
